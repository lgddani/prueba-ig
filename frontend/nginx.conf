server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # No cachear config.json: se regenera en cada arranque del contenedor a partir
    # de variables de entorno (API_URL / SIGNALR_URL).
    location = /assets/config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
